<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Page not found</title>
<script>
// Exact-release trees are not kept; each release line keeps its newest one.
const lines = ["3.0.x", "3.8.x", "3.10x", "4.7.x", "4.8.x", "4.9.x", "4.10x", "5.0.x", "5.1.x", "5.2.x"];
const base = "/micronaut-docs/";
const [version, ...page] = location.pathname.startsWith(base) ? location.pathname.slice(base.length).split("/") : [];
const line = /^(\d+\.\d+)\.\d/.exec(version || "")?.[1];
if (line) {
  const target = [line + ".x", line + "x"].find((name) => lines.includes(name)) || "latest";
  location.replace(base + target + "/" + page.join("/") + location.search + location.hash);
}
</script>
</head>
<body>
<p>This page does not exist. <a href="https://docs.micronaut.io/">Browse the Micronaut docs</a></p>
</body>
</html>
